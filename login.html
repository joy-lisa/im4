<!--=========================================================================
BESCHREIBUNG: Login-Seite des Projekts (login.html).
FUNKTION:
- Stellt das Anmeldeformular für die Applikation „Monster-Scanner“ bereit.
- Erfasst die Zugangsdaten (E-Mail-Adresse und Passwort) der Erziehungsberechtigten.
- Ermöglicht über den Submit-Button das Absenden der Daten, welche durch das
eingebundene Skript (login.js) verarbeitet werden.
- Bietet eine Navigation zurück zur Startseite (index.html) sowie einen direkten
Link zur Registrierung (register.html) für neue Nutzende.
=========================================================================-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <a href="index.html" id="back_btn_container">
    <button id="back_btn"> ← Zurück</button>
  </a>

  <div class="welcome-container">

    <div class="monster-icon">
      <img src="resources/img/monster_wasabi_02.svg" alt="Monster Icon">
    </div>

    <h1>Monster-Scanner</h1>
    <h2>Süsse Träume garantiert!🌟</h2>

    <form id="loginForm" class="card">
      <div class="field">
        <label for="email">Mama's oder Papa's E-Mail</label>
        <input type="email" id="email" required />
      </div>

      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="btn los"> <span class="stern-text">&#9734; &nbsp;</span> Los geht's! <span
          class="stern-text">&nbsp; &#9733;</span></button>

      <hr class="divider" />

      <p class="register-hint">Neu hier? <a href="register.html">Konto erstellen</a></p>

    </form>


  </div>

  <script src="js/login.js"></script>
</body>

</html>
