<!DOCTYPE html>

<html lang="de">



<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap');
  </style>

  <link rel="stylesheet" href="css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>



<body class="content-page">



  <main id="householdInfo">
    <header class="header">
      <img src="resources/img/monster_wasabi_02.svg" alt="Monster-Scanner Logo">

      <div>
        <h1>Monster-Scanner</h1>
        <p>Willkommen zurück!</p>
        <small>Familie <span id="hName">Du bist noch in keinem Haushalt</span></small>
      </div>

      <a href="konto.html">
        <button class="btn-profile">👤</button>
      </a>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-title">📈 Trend</div>
        <div id="trendValue">Lade Trend...</div>
      </article>

      <article class="card">
        <div class="card-title">🔔 Letzte Alarme</div>
        <div>3 Alarme</div>
      </article>

      <article class="card">
        <div class="card-title">🌙 Nachtaktivität</div>
        <div id="chartValue">Lade Diagramm...</div>
        <canvas id="monsterChart" style="display: none;"></canvas>
      </article>

    </section>
  </main>

  <!-- Popup für Leute ohne Haushalt -->
  <div id="noHousehold" class="popup-overlay" style="display: flex;">
    <div class="popup-content card haushalt-popup">

      <div id="no-household-zone">
        <h2>Willkommen!</h2>
        <p class="hint-text">Du bist noch in keinem Haushalt.</p>
      </div>

      <form id="householdForm" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="householdName">Neuen Haushalt gründen</label>
          <input type="text" id="householdName" placeholder="Name deines Haushalts" />
        </div>

        <button id="btnCreate" class="btn">Erstellen</button>
      </form>

      <div class="popup-spacer"></div>

      <form id="joinHouseholdForm" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="joinCode">Haushalt beitreten</label>
          <input type="text" id="joinCode" placeholder="Beitrittscode" />
        </div>

        <button id="btnJoin" class="btn btn-sub">Beitreten</button>
      </form>

    </div>
  </div>

  <script src="js/home.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
