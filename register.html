<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registrierung</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <a href="index.html">
      <button>⬅️</button>
    </a>

    <img src="resources/img/Logo_Monster-Scanner.svg" alt="Monster-Scanner Logo">
    
    <h1>Monster-Scanner</h1>
    <p>Süsse Träume garantiert!🌟</p>

    <form id="registerForm">
      <div>
        <label>Dein Name</label>
        <input type="text" id="name" required />
      </div>

      <div>
        <label>Name deines Kindes</label>
        <input type="text" id="childName" required />
      </div>

      <div>
        <label>Email</label>
        <input type="email" id="email" required />
      </div>

      <div>
        <label>Passwort</label>
        <input type="password" id="password" required />
      </div>

      <div>
        <label>Passwort wiederholen</label>
        <input type="password" id="confirmPassword" required />
      </div>

      <button type="submit"> 🩷 Monster-Schutz aktivieren!</button>
    </form>

    <p>Schon dabei? <a href="login.html">Anmelden 🌟</a>.</p>

    <script src="js/register.js"></script>
  </body>
</html>
