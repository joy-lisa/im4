<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Registrierung</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <a href="index.html" id="back_btn_container">
    <button id="back_btn"> ← Zurück</button>
  </a>

  <div class="welcome-container">

    <div class="monster-icon">
      <img src="resources/img/monster_wasabi_02.svg" alt="Monster Icon">
    </div>

    <h1>Monster-Scanner</h1>
    <h2>Süsse Träume garantiert!🌟</h2>

    <form id="registerForm" class="card">

      <div class="field">
        <label>Dein Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="field">
        <label>Name deines Kindes</label>
        <input type="text" id="childname" required />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="field">
        <label>Passwort</label>
        <input type="password" id="password" required />
      </div>

      <div class="field">
        <label>Passwort wiederholen</label>
        <input type="password" id="passwordConfirm" required />
      </div>

      <button type="submit" class="btn los"> Monster-Schutz aktivieren!</button>

      <hr class="divider" />

      <p class="register-hint">Schon dabei? <a href="login.html">Anmelden</a><span class="stern-text">&nbsp;
          &#9733;</span></p>



  </div>

  <script src="js/register.js"></script>
</body>

</html>
