<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Konto und Einstellungen</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <a href="index.html">
        <button> Zurück </button>
    </a>

    <h1>Konto und Einstellungen</h1>
    <p>Dein Profil verwalten</p>

    <section class="haushalt">
        <h1>Haushalt</h1>
            <div id="householdInfo">
                <label>Dein Name</label>
                <p>Dein Name <span id="uName"></span></p>
            </div>

            <div>
                <label>Name deines Kindes</label>
                <input type="text" id="childName" />
            </div>

    </section>

    <section class="dein-monster">
        <h1>Dein Monster</h1>
        <p>Hier kannst du dein Monster auswählen.</p>
        <button>Monster ändern</button>
    </section>

    <section class="email">
        <h1>Email-Adresse</h1>
        <p id="userEmail">Hier steht deine Email-Adresse. (wahrscheinlich in .js)</p>
    </section>

    <!-- Box für Leute OHNE Haushalt -->
     <div id="noHousehold" style="display: none;">
    <p>Du bist noch in keinem Haushalt.</p>

    <div>
        <input type="text" id="householdName" placeholder="Name für neuen Haushalt" />
        <button id="btnCreate">Haushalt erstellen</button>
    </div>
    
    <br>
    <div>
        <input type="text" id="joinCode" placeholder="Beitritts-Code eingeben" />
        <button id="btnJoin">Haushalt beitreten</button>
    </div>
</div>

    <!-- Box für Leute MIT Haushalt -->
    <div id="householdInfo" style="display:none;">
        <h1>Dein Haushalt: <span id="hName"></span></h1>
        <p>Teile diesen Code mit anderen: <strong id="hCode"></strong></p>
    </div>

    <section>
        <h1>Passwort</h1>
        <button>Passwort ändern</button>
    </section>

    <section>

        <button type="save"> Änderungen speichern</button>

        <button>Konto löschen</button>

    </section>

    <section>
        <button id="logoutBtn">Logout</button>
    </section>

   <script src="js/home.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
