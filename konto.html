<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Konto und Einstellungen</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <a href="index.html">
        <button> Zurück </button>
    </a>

    <h1>Konto und Einstellungen</h1>
    <p>Dein Profil verwalten</p>

    <section class="haushalt">
        <h1>Haushalt</h1>
        <form id="registerForm">
            <div>
                <label>Dein Name</label>
                <input type="text" id="name" />
            </div>

            <div>
                <label>Name deines Kindes</label>
                <input type="text" id="childName" />
            </div>

    </section>

    <section class="dein-monster">
        <h1>Dein Monster</h1>
        <p>Hier kannst du dein Monster auswählen.</p>
        <button>Monster ändern</button>
    </section>

    <section class="email">
        <h1>Email-Adresse</h1>
        <p>Hier steht deine Email-Adresse. (wahrscheinlich in .js)</p>
    </section>

    <section>
        <h1>Passwort</h1>
        <button>Passwort ändern</button>
    </section>

    <section>

        <button type="save"> Änderungen speichern</button>

        <button>Konto löschen</button>

    </section>

    <section>
        <button id="logoutBtn">Logout</button>
    </section>

    <script src="js/logout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
